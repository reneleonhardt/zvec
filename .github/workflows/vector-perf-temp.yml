name: Vector performance experiment
on:
  push:
    branches: [perf/reduce-allocations]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vector-perf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      BASELINE_SHA: 8d4996924bce78f8b072a353803c305101bcc807
      BEFORE_SHA: 0659259a7fae0f5d0fec5337e82a37b975db7a6a
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache-vector-perf
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: .apt-vector-perf/*.deb
          key: vector-perf-apt-2604-v1-${{ github.run_id }}
          restore-keys: vector-perf-apt-2604-v1-
      - name: Install benchmark build tools
        run: |
          mkdir -p .apt-vector-perf
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dir::Cache::archives="$GITHUB_WORKSPACE/.apt-vector-perf" -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends build-essential cmake ninja-build ccache python3 git ca-certificates zstd libaio-dev liburing-dev libzstd-dev linux-perf
          perf --version
          mkdir -p results
          lscpu > results/cpu.txt
          uname -a > results/kernel.txt
          cat /etc/os-release > results/os-release.txt
          c++ --version > results/compiler.txt
          cmake --version > results/cmake.txt
      - uses: actions/upload-artifact@v7
        with:
          name: vector-perf-cpu-${{ github.run_id }}
          path: |
            results/cpu.txt
            results/compiler.txt
          retention-days: 14
      - uses: actions/cache/save@v6
        with:
          path: .apt-vector-perf/*.deb
          key: vector-perf-apt-2604-v1-${{ github.run_id }}
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: candidate
      - name: Identify compatible reference binaries
        id: toolchain
        run: |
          fingerprint=$({
            c++ --version
            cmake --version
            ld --version
            ldd --version
          } | sha256sum | cut -c 1-24)
          echo "key=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: main-reference
        with:
          path: bench-main
          key: vector-perf-main-v2-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ env.BASELINE_SHA }}-${{ hashFiles('candidate/.github/benchmarks/vector-perf/*.cc', 'candidate/.github/benchmarks/vector-perf/*.h', 'candidate/.github/benchmarks/vector-perf/*.c', 'candidate/.github/benchmarks/vector-perf/CMakeLists.txt') }}
      - uses: actions/cache/restore@v6
        id: before-reference
        with:
          path: bench-before
          key: vector-perf-before-v2-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ env.BEFORE_SHA }}-${{ hashFiles('candidate/.github/benchmarks/vector-perf/*.cc', 'candidate/.github/benchmarks/vector-perf/*.h', 'candidate/.github/benchmarks/vector-perf/*.c', 'candidate/.github/benchmarks/vector-perf/CMakeLists.txt') }}
      - uses: actions/cache/restore@v6
        id: build-cache
        with:
          path: .ccache-vector-perf
          key: vector-perf-2604-gcc-${{ runner.arch }}-${{ github.sha }}
          restore-keys: vector-perf-2604-gcc-${{ runner.arch }}-
      - uses: actions/cache/restore@v6
        id: candidate-reference
        with:
          path: bench-candidate
          key: vector-perf-candidate-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ github.sha }}
      - name: Build frozen references
        run: |
          set -euo pipefail
          cp -a candidate/.github/benchmarks/vector-perf benchmark-harness
          git -C candidate fetch --depth=1 origin "$BASELINE_SHA" "$BEFORE_SHA"
          for pair in "main:$BASELINE_SHA" "before:$BEFORE_SHA"; do
            label=${pair%%:*}
            revision=${pair#*:}
            if [[ -x "bench-$label/vector_system_search" ]]; then
              test "$(cat "bench-$label/source-sha.txt")" = "$revision"
              echo "Reusing frozen $label executables"
            else
              git -C candidate checkout --detach "$revision"
              git -C candidate submodule update --init --recursive
              test "$(git -C candidate rev-parse HEAD)" = "$revision"
              nice -n 10 cmake -S benchmark-harness -B bench-build -G Ninja \
                -DZVEC_SOURCE_DIR="$GITHUB_WORKSPACE/candidate" -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              nice -n 10 cmake --build bench-build --target vector_system_search vector_pool_workloads vector_alloc_probe --parallel 4
              mkdir "bench-$label"
              cp bench-build/vector_system_search bench-build/vector_pool_workloads bench-build/libvector_alloc_probe.so "bench-$label/"
              echo "$revision" > "bench-$label/source-sha.txt"
            fi
            ldd "bench-$label/vector_system_search" > "results/$label-libraries.txt"
            if grep -q '/bench-build/' "results/$label-libraries.txt"; then
              echo "Unexpected mutable runtime library dependency" >&2
              exit 1
            fi
          done
      - uses: actions/cache/save@v6
        if: steps.main-reference.outputs.cache-hit != 'true'
        with:
          path: bench-main
          key: ${{ steps.main-reference.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: steps.before-reference.outputs.cache-hit != 'true'
        with:
          path: bench-before
          key: ${{ steps.before-reference.outputs.cache-primary-key }}
      - name: Restore candidate and build uncached binaries
        run: |
          set -euo pipefail
          git -C candidate checkout --detach "$GITHUB_SHA"
          git -C candidate submodule update --init --recursive
          if [[ '${{ steps.candidate-reference.outputs.cache-hit }}' == 'true' ]]; then
            echo "Reusing candidate executables and original-symbol proof"
            exit 0
          fi
          nice -n 10 cmake -S benchmark-harness -B build-candidate -G Ninja \
            -DZVEC_SOURCE_DIR="$GITHUB_WORKSPACE/candidate" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          nice -n 10 cmake --build build-candidate --target vector_system_search vector_pool_workloads vector_alloc_probe turbo_avx2_distance_test turbo_fp16_quantizer_test --parallel 4
          mkdir bench-candidate
          cp build-candidate/vector_system_search build-candidate/vector_pool_workloads build-candidate/libvector_alloc_probe.so \
            build-candidate/zvec/bin/turbo_avx2_distance_test build-candidate/zvec/bin/turbo_fp16_quantizer_test bench-candidate/
          echo "$GITHUB_SHA" > bench-candidate/source-sha.txt
          nice -n 10 python3 benchmark-harness/exact_bits.py \
            --source-root "$GITHUB_WORKSPACE/candidate" --source-ref "$BEFORE_SHA" \
            --build-root "$GITHUB_WORKSPACE/build-candidate" \
            --output "$GITHUB_WORKSPACE/bench-candidate/exact-bits" --build-only \
            > results/original-symbol-build.txt 2>&1
      - name: Validate cached candidate on this CPU before timing
        run: |
          set -euo pipefail
          test "$(cat bench-candidate/source-sha.txt)" = "$GITHUB_SHA"
          for binary in vector_system_search vector_pool_workloads turbo_avx2_distance_test turbo_fp16_quantizer_test exact-bits; do
            test -x "bench-candidate/$binary"
            ldd "bench-candidate/$binary" >> results/candidate-libraries.txt
          done
          test -f bench-candidate/libvector_alloc_probe.so
          if grep -Eq '/(bench-build|build-candidate)/' results/candidate-libraries.txt; then exit 1; fi
          nice -n 10 bench-candidate/turbo_avx2_distance_test > results/arithmetic-check.txt 2>&1
          nice -n 10 bench-candidate/turbo_fp16_quantizer_test --gtest_filter=Fp16Quantizer.DecodePreservesBitsForEveryHalfEncoding:Fp16Quantizer.CosineDecodePreservesBitsAndExceptionFlags:Fp16Quantizer.StoragePrecisionConvertsBeforeCosineNormalization >> results/arithmetic-check.txt 2>&1
          printf 'Frozen source: %s; candidate: %s\n' "$BEFORE_SHA" "$GITHUB_SHA" > results/original-symbol-check.txt
          nice -n 10 bench-candidate/exact-bits >> results/original-symbol-check.txt 2>&1
          ccache --show-stats > results/ccache.txt
      - uses: actions/cache/save@v6
        if: steps.candidate-reference.outputs.cache-hit != 'true'
        with:
          path: bench-candidate
          key: ${{ steps.candidate-reference.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache-vector-perf
          key: vector-perf-2604-gcc-${{ runner.arch }}-${{ github.sha }}
      - name: Paired CPU allocation and wall-time benchmarks
        run: |
          set -euo pipefail
          python3 benchmark-harness/run.py bench-main bench-before bench-candidate results | tee results/paired.log
      - name: Profile remaining IVF search and training costs
        if: success()
        run: |
          set -euo pipefail
          perf_bin=$(command -v perf)
          sudo sysctl -w kernel.perf_event_paranoid=1
          profile_arch=auto
          export VECTOR_PERF_ARCH="$profile_arch"
          record_profile() {
            profile_output=$1
            shift
            "$perf_bin" record -e cycles:u -g --call-graph dwarf -o "$profile_output" -- "$@" ||
              "$perf_bin" record -e cpu-clock:u -g --call-graph dwarf -o "$profile_output" -- "$@"
          }
          record_profile results/ivf-search.perf \
            bench-candidate/vector_system_search warm "$GITHUB_WORKSPACE/results/$profile_arch" ivf bufferpool 0 4 8 1 > results/profile-search.csv 2> results/profile-search.log
          "$perf_bin" report -i results/ivf-search.perf --stdio > results/ivf-search-profile.txt
          record_profile results/ivf-write.perf \
            bench-candidate/vector_pool_workloads write "$GITHUB_WORKSPACE/results/$profile_arch" ivf bufferpool 8193 20 128 > results/profile-write.csv 2> results/profile-write.log
          "$perf_bin" report -i results/ivf-write.perf --stdio > results/ivf-write-profile.txt
          for kind in flat fp16 raw16 physical cos32 ip32; do
            record_profile "results/$kind-search.perf" \
              bench-candidate/vector_system_search warm "$GITHUB_WORKSPACE/results/auto" "$kind" bufferpool 0 1 8 1 > "results/profile-$kind.csv" 2> "results/profile-$kind.log"
            "$perf_bin" report -i "results/$kind-search.perf" --stdio > "results/$kind-search-profile.txt"
          done
          record_profile results/physical-fetch.perf \
            bench-candidate/vector_system_search fetchwarm "$GITHUB_WORKSPACE/results/auto" physical bufferpool 0 1 8 1 > results/profile-fetch.csv 2> results/profile-fetch.log
          "$perf_bin" report -i results/physical-fetch.perf --stdio > results/physical-fetch-profile.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vector-perf-amd64-${{ github.sha }}
          path: |
            results/*.json
            results/*.csv
            results/*.log
            results/*.txt
            results/*.perf
          retention-days: 14
